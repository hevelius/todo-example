name: OpenCode Task Runner

on:
  workflow_dispatch:

env:
  MAX_STUCK: 2   # consecutive failed attempts on the same task before stopping

jobs:
  run-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Restore Copilot auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '${{ secrets.OPENCODE_AUTH_JSON }}' > ~/.local/share/opencode/auth.json

      - name: Identify next task and stuck count
        id: pick
        run: |
          TASK_LINE=$(grep -m1 '^\- \[ \]' tasks.md || true)
          if [ -z "$TASK_LINE" ]; then
            echo "No tasks left in tasks.md"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TASK_ID=$(echo "$TASK_LINE" | md5sum | cut -c1-8)
          STUCK=$(grep -A1 "^## task:$TASK_ID" progress.md 2>/dev/null | grep -oP 'attempts:\s*\K[0-9]+' || echo 0)

          echo "task_text=$TASK_LINE" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "stuck_count=$STUCK" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Stop and flag if stuck (no-progress check)
        if: steps.pick.outputs.skip == 'false' && steps.pick.outputs.stuck_count >= env.MAX_STUCK
        run: |
          gh issue create \
            --title "Task stuck after ${{ env.MAX_STUCK }} attempts: ${{ steps.pick.outputs.task_id }}" \
            --body "The loop repeated the same error ${{ env.MAX_STUCK }} times on this task. Manual intervention required. See progress.md for details."
          echo "Task stuck, stopping without retrying."
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the task with OpenCode
        timeout-minutes: 8
        if: steps.pick.outputs.skip == 'false' && steps.pick.outputs.stuck_count < env.MAX_STUCK
        run: |
          opencode run "Read tasks.md, implement this task: ${{ steps.pick.outputs.task_text }}. \
          Then @component-tester writes and runs the tests, @a11y-reviewer checks accessibility. \
          Do not mark anything as completed in tasks.md, the next step will do it." --print-logs

      - name: Verify (the real checker)
        id: verify
        if: steps.pick.outputs.skip == 'false' && steps.pick.outputs.stuck_count < env.MAX_STUCK
        run: |
          npm test > test_output.log 2>&1 && npx tsc --noEmit >> test_output.log 2>&1
          echo "passed=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: On success — mark done, commit, open PR
        if: steps.verify.outputs.passed == '0'
        run: |
          sed -i "0,/^- \[ \]/{s/^- \[ \]/- [x]/}" tasks.md
          sed -i "/^## task:${{ steps.pick.outputs.task_id }}/,+2d" progress.md 2>/dev/null || true

          BRANCH="task-${{ steps.pick.outputs.task_id }}-${{ github.run_number }}"
          git checkout -b "$BRANCH"
          git config user.name "opencode-bot"
          git config user.email "opencode-bot@users.noreply.github.com"
          git add -A
          git commit -m "Auto: complete task ${{ steps.pick.outputs.task_id }}"
          git push origin "$BRANCH"
          gh pr create --title "Automatic task: ${{ steps.pick.outputs.task_id }}" \
            --body "Executed by the loop. Tests and a11y review passed. See the diff for details."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: On failure — record attempt in the spine, no PR
        if: steps.pick.outputs.skip == 'false' && steps.verify.outputs.passed != '0'
        run: |
          NEW_COUNT=$((${{ steps.pick.outputs.stuck_count }} + 1))
          {
            echo "## task:${{ steps.pick.outputs.task_id }}"
            echo "attempts: $NEW_COUNT"
            echo "last_error:"
            tail -30 test_output.log
            echo ""
          } >> progress.md

          git config user.name "opencode-bot"
          git config user.email "opencode-bot@users.noreply.github.com"
          git add progress.md
          git commit -m "Record failed attempt on task ${{ steps.pick.outputs.task_id }} ($NEW_COUNT/${{ env.MAX_STUCK }})"
          git push origin HEAD:main