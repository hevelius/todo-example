name: OpenCode Copilot Auth Test

on:
  workflow_dispatch:

jobs:
  test-copilot-auth:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Verify install
        run: opencode --version

      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Restore Copilot auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '${{ secrets.OPENCODE_AUTH_JSON }}' > ~/.local/share/opencode/auth.json

      - name: Verify auth.json structure (no secrets printed)
        run: |
          jq 'keys' ~/.local/share/opencode/auth.json
          jq '.["github-copilot"] | keys' ~/.local/share/opencode/auth.json

      - name: Test non-interactive run with Copilot (verbose)
        run: |
          opencode run "Rispondi solo con: autenticazione riuscita" --model github-copilot/claude-sonnet-4-6 --print-logs